<!DOCTYPE html>
<html>
<head>
  <title>INTEL CEG MYS RETRO NIGHT • SHAKE-it CHALLENGE</title>
  <!-- Pinned version so a library update can't change behaviour on event night -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <style>
    /* 70s/80s Retro Grid & Neon Styles */
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #0c0f1d;
      background-image:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      color: white;
      padding: 25px;
      margin: 0;
      user-select: none;
    }

    .header-container { text-align: center; margin-bottom: 20px; }
    h1 {
      font-size: 3.4rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
      font-weight: 900;
    }
    .main-title-2 {
      font-size: 4rem;
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f, 0 0 25px #ff007f, 0 0 50px #ff007f;
      letter-spacing: 5px;
      margin-top: 8px;
    }

    .subtitle {
      text-align: center;
      color: #ffbf00;
      font-size: 1.4rem;
      margin-top: 15px;
      margin-bottom: 25px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(255, 191, 0, 0.7);
    }

    #controlBar {
      max-width: 1100px;
      margin: 0 auto 25px auto;
      background: #121526;
      border-radius: 12px;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 3px solid #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    .btn-container { display: flex; gap: 12px; align-items: center; }
    .btn-control {
      background: #ff007f;
      color: white;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px #ff007f;
      transition: all 0.2s;
    }
    .btn-control:hover { background: #00ffff; color: #090b15; box-shadow: 0 0 25px #00ffff; }

    .btn-reset {
      background: #27272a;
      border: 2px solid #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
      font-size: 1.1rem;
      padding: 14px 20px;
    }
    .btn-reset:hover { background: #ef4444; color: white; box-shadow: 0 0 20px #ef4444; }

    .btn-export {
      background: #10b981;
      border: 2px solid #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      font-size: 1.15rem;
      padding: 14px 22px;
      display: none;
    }
    .btn-export:hover { background: #059669; box-shadow: 0 0 22px #10b981; }

    .timer-box { font-size: 2.3rem; color: #00ffff; font-weight: bold; text-shadow: 0 0 10px #00ffff; }
    .round-info { font-size: 1.3rem; color: #ffbf00; font-weight: bold; text-shadow: 0 0 5px rgba(255,191,0,0.5); }
    /* NEW: small live-link / phones-reporting line under the round status */
    .link-info { font-size: 0.95rem; margin-top: 6px; font-weight: bold; }
    .link-ok { color: #34d399; }
    .link-bad { color: #ef4444; }

    #raceTrack {
      max-width: 1100px;
      margin: 0 auto;
      background: #121526;
      border-radius: 16px;
      padding: 25px;
      border: 3px solid #3d1b5c;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.15);
      min-height: 480px;
    }
    .racer { margin: 16px 0; background: #090b15; border-radius: 12px; padding: 5px; border: 2px solid #3d1b5c; position: relative; overflow: hidden; }
    .bar {
      height: 46px;
      background: linear-gradient(90deg, #ff007f, #b300ff, #00ffff, #ffbf00);
      border-radius: 8px;
      transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      padding-left: 15px;
      font-weight: bold;
      white-space: nowrap;
      font-size: 1.2rem;
      color: #FFFFFF;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    /* Live Participant Counter - Glowing Retro Yellow */
    .player-counter {
      color: #ffbf00;
      text-shadow: 0 0 12px #ffbf00;
      font-weight: bold;
      font-size: 1.8rem;
      margin: 15px auto;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>🕺 INTEL CEG MYS RETRO NIGHT 🕺</h1>
    <h1 class="main-title-2">✨ SHAKE-it CHALLENGE ✨</h1>
  </div>

  <div class="subtitle">🚀 HIT THE TURBO BOOST • GO FOR THE HIGH SCORE! 📼 🕹️</div>

  <!-- Host Controls Panel -->
  <div id="controlBar">
    <div>
      <div class="round-info" id="roundStatus">ROUND 1 OF 3 (STANDBY)</div>
      <div class="link-info link-bad" id="linkStatus">🔴 CONNECTING…</div>
    </div>
    <div class="timer-box" id="timeRemaining">30s</div>
    <div class="btn-container">
      <button class="btn-control btn-export" id="exportBtn" onclick="exportFullLeaderboard()">📥 EXPORT FULL RESULTS (CSV)</button>
      <button class="btn-control btn-reset" onclick="resetTournament()">⚠️ RESET ALL</button>
      <button class="btn-control" id="startBtn" onclick="triggerStart()">START ROUND 1</button>
    </div>
  </div>

  <!-- Realtime Track Arena -->
  <div id="raceTrack"></div>

  <script>
    // =====================================================================
    // CONFIG — topic names MUST match index.html
    // =====================================================================
    const SUPABASE_URL = 'https://jtmctkvjfcqizcliimez.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KGzvBz2fj6wXguYTiz7c9A_YA4Du6wG';
    const CONTROL_TOPIC = 'ceg-retro-shake-control';   // host -> phones
    const SCORES_TOPIC  = 'ceg-retro-shake-scores';    // phones -> host
    const JOIN_URL = 'https://hanif1993.github.io/CEG-Retro-Shake/supabase/';
    const STORAGE_KEY = 'ceg_retro_shake_host_v2';

    const TOTAL_ROUNDS  = 3;
    const ROUND_SECONDS = 30;

    // ---- Which Supabase plan is this project on? ('free' or 'pro') ----
    // Supabase limits Realtime messages per second (averaged over 60 s), and every
    // delivery counts. These settings keep 150 players safely inside the limit:
    //   free: 100 msg/s limit -> each player's bar refreshes about every 7–8 s
    //   pro : 500 msg/s limit -> each player's bar refreshes about every 2 s
    const SUPABASE_PLAN = 'free';
    const PLAN_SETTINGS = {
      free: { scoreMsgsPerSec: 20, heartbeatMs: 8000 },
      pro:  { scoreMsgsPerSec: 80, heartbeatMs: 5000 }
    };
    const PLAN = PLAN_SETTINGS[SUPABASE_PLAN] || PLAN_SETTINGS.free;
    const MIN_SYNC_MS = 2000;

    const MIN_STATE_GAP_MS = 2500;   // early "round is live" re-sends at most this often
    const END_GRACE_MS = 6000;       // wait for phones' final scores before the final ranking
    const MAX_SHAKES_PER_SEC = 14;   // a phone can count at most 1 shake / 75 ms (≈13.3/s)

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: {
        heartbeatCallback: (status) => {
          if (status === 'ok') setLinkOk(true);
          else if (status === 'timeout' || status === 'error') setLinkOk(false);
        }
      }
    });

    // =====================================================================
    // STATE
    // =====================================================================
    let gameId = newGameId();
    let currentRound = 1;            // round being played, or the next one to start
    let phase = 'standby';           // standby | live | tally | between | finished
    let roundStartedAt = 0;
    let roundEndsAt = 0;
    let lastHeartbeatAt = 0;
    let stateRequested = false;      // a phone joined mid-round and needs the round state
    let currentSyncMs = MIN_SYNC_MS;
    let players = {};                // id -> { name, rounds: { "1": n, "2": n, "3": n }, lastRound }
    let timerInterval = null;
    let renderInterval = null;
    let tallyTimeout = null;
    let leaderboardDirty = false;
    let saveDirty = false;
    let counterRafPending = false;
    let linkOk = false;

    function newGameId() {
      return 'g_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
    }

    function totalOf(p) {
      return Object.values(p.rounds || {}).reduce((s, n) => s + (Number(n) || 0), 0);
    }

    // =====================================================================
    // REALTIME CHANNELS
    // =====================================================================
    // Host sends round control here (all phones listen)
    const controlChannel = supabaseClient.channel(CONTROL_TOPIC, {
      config: { broadcast: { self: false, ack: false } }
    });
    controlChannel.subscribe((status) => {
      console.log('Control channel:', status);
      setChannelOk('control', status === 'SUBSCRIBED');
    });

    // Phones send scores here (only the host listens)
    const scoresChannel = supabaseClient.channel(SCORES_TOPIC, {
      config: { broadcast: { self: false, ack: false } }
    });

    scoresChannel.on('broadcast', { event: 'player_joined' }, ({ payload }) => {
      if (!payload || !payload.id) return;
      const p = getOrCreatePlayer(payload.id, payload.name);
      if (!p) return;
      saveDirty = true;
      scheduleLiveCounterUpdate();
      // Someone joined/reconnected mid-round: send the round state early (rate-limited)
      if (phase === 'live') stateRequested = true;
    });

    scoresChannel.on('broadcast', { event: 'score_update' }, ({ payload }) => {
      if (!payload || !payload.id) return;
      // Only accept scores for THIS tournament and THIS round, while it is live or tallying
      if (payload.gameId !== gameId) return;
      if (phase !== 'live' && phase !== 'tally') return;
      const round = Number(payload.round);
      if (round !== currentRound) return;

      const p = getOrCreatePlayer(payload.id, payload.name);
      if (!p) return;

      // Anti-cheat: nobody can legitimately shake faster than the phone's 75 ms debounce allows
      const elapsedSec = Math.min(ROUND_SECONDS + 2, (Date.now() - roundStartedAt) / 1000 + 1);
      const maxAllowed = Math.ceil(elapsedSec * MAX_SHAKES_PER_SEC) + 5;
      const claimed = Math.floor(Number(payload.roundScore) || 0);
      const score = Math.max(0, Math.min(claimed, maxAllowed));

      // Scores only go up within a round, so keep the highest one received
      p.rounds[round] = Math.max(p.rounds[round] || 0, score);
      p.lastRound = round;

      // Late correction for EARLIER rounds (phone's final score didn't arrive in time)
      if (payload.allRounds && typeof payload.allRounds === 'object') {
        const maxRound = Math.ceil(ROUND_SECONDS * MAX_SHAKES_PER_SEC) + 5;
        for (const [rKey, val] of Object.entries(payload.allRounds)) {
          const r = Number(rKey);
          if (!(r >= 1 && r < currentRound)) continue;
          const v = Math.max(0, Math.min(Math.floor(Number(val) || 0), maxRound));
          if (v > (p.rounds[r] || 0)) p.rounds[r] = v;
        }
      }
      leaderboardDirty = true;
      saveDirty = true;
    });

    scoresChannel.subscribe((status) => {
      console.log('Scores channel:', status);
      setChannelOk('scores', status === 'SUBSCRIBED');
    });

    function getOrCreatePlayer(id, name) {
      const cleanId = String(id).slice(0, 40);
      const cleanName = String(name || 'Unknown').slice(0, 40);
      if (!players[cleanId]) {
        players[cleanId] = { name: cleanName, rounds: {}, lastRound: 0 };
      } else if (name) {
        players[cleanId].name = cleanName;
      }
      return players[cleanId];
    }

    function sendControl(payload) {
      try {
        // If the socket is reconnecting, supabase-js falls back to HTTPS automatically
        controlChannel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: Object.assign({ gameId }, payload)
        });
      } catch (e) { console.warn(e); }
    }

    // =====================================================================
    // SAVE / RESTORE (an accidental refresh of this page no longer loses the results)
    // =====================================================================
    function saveHostState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ gameId, currentRound, phase, players }));
      } catch (e) {}
      saveDirty = false;
    }

    function restoreHostState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const s = JSON.parse(raw);
        if (!s || typeof s.gameId !== 'string') return false;
        gameId = s.gameId;
        currentRound = Number(s.currentRound) || 1;
        players = s.players || {};
        phase = s.phase || 'standby';
        // Page was refreshed in the middle of a round -> that round must be replayed
        if (phase === 'live' || phase === 'tally') phase = 'interrupted';
        return true;
      } catch (e) { return false; }
    }

    setInterval(() => { if (saveDirty) saveHostState(); }, 1000);

    window.addEventListener('beforeunload', (e) => {
      saveHostState();
      if (Object.keys(players).length > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // =====================================================================
    // UI
    // =====================================================================
    // Both channels must be joined for a green light
    const channelOk = { control: false, scores: false };
    function setChannelOk(which, ok) {
      channelOk[which] = ok;
      setLinkOk(channelOk.control && channelOk.scores);
    }
    function setLinkOk(ok) {
      linkOk = ok;
      updateLinkStatus();
    }

    function updateLinkStatus() {
      const el = document.getElementById('linkStatus');
      if (!el) return;
      const total = Object.keys(players).length;
      let text = linkOk ? '🟢 LIVE LINK' : '🔴 RECONNECTING…';
      if (phase === 'live' || phase === 'tally') {
        const reporting = Object.values(players).filter(p => p.lastRound === currentRound).length;
        text += ` • 📡 ${reporting}/${total} phones reporting`;
      } else {
        text += ` • ${total} dancers`;
      }
      el.className = 'link-info ' + (linkOk ? 'link-ok' : 'link-bad');
      el.innerText = text;
    }

    function standbyHtml() {
      const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' +
                 encodeURIComponent(JOIN_URL) + '&color=ff007f&bgcolor=121526';
      return `
        <div id="standbyMessage" style="text-align: center; padding: 40px 50px; color: #64748B; font-size: 1.5rem; line-height: 1.8;">
          <span style="color: #ff007f; text-shadow: 0 0 5px #ff007f; font-weight: bold;">Scan the QR code to join the dance floor!</span><br><br>
          <img src="${qr}" alt="Scan to Join"
               style="border: 4px solid #00ffff; border-radius: 12px; box-shadow: 0 0 20px #00ffff; margin: 10px auto;"/><br>
          <div class="player-counter" id="liveCounter">⚡ DANCERS JOINED IN: ${Object.keys(players).length}</div>
          Press [START ROUND 1] when everyone is locked in!
        </div>`;
    }

    function showStandby() {
      document.getElementById('raceTrack').innerHTML = standbyHtml();
    }

    function scheduleLiveCounterUpdate() {
      if (counterRafPending) return;
      counterRafPending = true;
      requestAnimationFrame(() => {
        counterRafPending = false;
        const counterEl = document.getElementById('liveCounter');
        if (counterEl) counterEl.innerText = `⚡ DANCERS JOINED IN: ${Object.keys(players).length}`;
        updateLinkStatus();
      });
    }

    function setStartButton(enabled, label) {
      const btn = document.getElementById('startBtn');
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? '1' : '0.5';
      if (label) btn.innerText = label;
    }

    function sortedPlayers() {
      return Object.values(players).sort((a, b) =>
        (totalOf(b) - totalOf(a)) || String(a.name).localeCompare(String(b.name)));
    }

    // =====================================================================
    // ROUND FLOW
    // =====================================================================
    function triggerStart() {
      if (phase === 'live' || phase === 'tally' || phase === 'finished') return;
      setStartButton(false);
      startRound();
    }

    function startRound() {
      phase = 'live';
      roundStartedAt = Date.now();
      roundEndsAt = roundStartedAt + ROUND_SECONDS * 1000;

      // (Re)start this round from zero for everybody (also handles replaying an interrupted round)
      Object.values(players).forEach(p => { p.rounds[currentRound] = 0; if (p.lastRound === currentRound) p.lastRound = 0; });
      leaderboardDirty = true;
      saveHostState();

      // Spread phone traffic so the whole room stays under the plan's message budget
      const playerCount = Math.max(1, Object.keys(players).length);
      currentSyncMs = Math.max(MIN_SYNC_MS, Math.ceil(playerCount / PLAN.scoreMsgsPerSec * 1000));

      document.getElementById('roundStatus').innerText = `⚡ ROUND ${currentRound} RUNNING! ⚡`;
      document.getElementById('timeRemaining').innerText = `${ROUND_SECONDS}s`;

      sendControl({ action: 'start', round: currentRound, timeLeft: ROUND_SECONDS, syncMs: currentSyncMs });
      lastHeartbeatAt = Date.now();

      renderLeaderboard();
      clearInterval(renderInterval);
      renderInterval = setInterval(() => {
        if (leaderboardDirty) {
          leaderboardDirty = false;
          renderLeaderboard();
        }
        updateLinkStatus();
      }, 250);

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const leftMs = roundEndsAt - Date.now();
        const left = Math.max(0, Math.ceil(leftMs / 1000));
        document.getElementById('timeRemaining').innerText = `${left}s`;

        // "Round is live" heartbeat: phones that missed START (late, refreshed, reconnected) jump in.
        // Sent every heartbeatMs, or sooner (but not more often than MIN_STATE_GAP_MS) when a phone asks.
        const sinceLast = Date.now() - lastHeartbeatAt;
        const due = sinceLast >= PLAN.heartbeatMs || (stateRequested && sinceLast >= MIN_STATE_GAP_MS);
        if (left > 2 && due) {
          lastHeartbeatAt = Date.now();
          stateRequested = false;
          sendControl({ action: 'state', round: currentRound, timeLeft: leftMs / 1000, syncMs: currentSyncMs });
        }

        if (leftMs <= 0) endRound();
      }, 250);
    }

    function endRound() {
      clearInterval(timerInterval);
      phase = 'tally';
      sendControl({ action: 'end', round: currentRound });

      document.getElementById('roundStatus').innerText = `🏁 ROUND ${currentRound} OVER! TALLYING FINAL SCORES…`;
      document.getElementById('timeRemaining').innerText = '00s';
      renderLeaderboard();

      // Keep accepting final scores for a few seconds, then lock the round
      clearTimeout(tallyTimeout);
      tallyTimeout = setTimeout(finishTally, END_GRACE_MS);
    }

    function finishTally() {
      clearInterval(renderInterval);
      renderLeaderboard();
      document.getElementById('exportBtn').style.display = 'inline-block';

      if (currentRound < TOTAL_ROUNDS) {
        currentRound++;
        phase = 'between';
        document.getElementById('roundStatus').innerText = `🏁 ROUND ${currentRound - 1} OVER! GET READY FOR ROUND ${currentRound}`;
        document.getElementById('timeRemaining').innerText = `${ROUND_SECONDS}s`;
        setStartButton(true, `START ROUND ${currentRound}`);
      } else {
        phase = 'finished';
        document.getElementById('roundStatus').innerText = `👾 GAME OVER • TOURNAMENT FINISHED 👾`;
        document.getElementById('timeRemaining').innerText = '00s';
        document.getElementById('startBtn').style.display = 'none';
      }
      saveHostState();
      updateLinkStatus();
    }

    function resetTournament() {
      if (confirm("⚠️ Are you sure you want to RESET the entire game? This deletes all scores!")) {
        clearInterval(timerInterval);
        clearInterval(renderInterval);
        clearTimeout(tallyTimeout);
        leaderboardDirty = false;
        currentRound = 1;
        phase = 'standby';
        players = {};
        gameId = newGameId();   // phones holding old scores will drop them

        sendControl({ action: 'hard_reset' });
        saveHostState();

        document.getElementById('roundStatus').innerText = "ROUND 1 OF 3 (STANDBY)";
        document.getElementById('timeRemaining').innerText = `${ROUND_SECONDS}s`;
        const btn = document.getElementById('startBtn');
        btn.style.display = 'inline-block';
        setStartButton(true, "START ROUND 1");
        document.getElementById('exportBtn').style.display = 'none';
        showStandby();
        updateLinkStatus();
      }
    }

    function renderLeaderboard() {
      const sorted = sortedPlayers().slice(0, 10);
      const track = document.getElementById('raceTrack');
      if (sorted.length === 0) return;

      const topScore = totalOf(sorted[0]) || 1;
      const existingBars = track.querySelectorAll('.racer .bar');

      if (existingBars.length !== sorted.length) {
        track.innerHTML = sorted.map(() => `
          <div class="racer">
            <div class="bar" style="width: 12%;"></div>
          </div>`).join('');
      }

      const bars = track.querySelectorAll('.racer .bar');
      sorted.forEach((p, index) => {
        const total = totalOf(p);
        const pct = Math.min(100, Math.max(12, Math.round((total / (topScore * 1.15)) * 100)));
        let iconMarker = '';

        if (index === 0) iconMarker = '👑 🪩 ';
        else if (index === 1) iconMarker = '⚡ 📼 ';
        else if (index === 2) iconMarker = '✨ 🛼 ';
        else if (index === 3) iconMarker = '📻 ';
        else if (index === 4) iconMarker = '🕹️ ';
        else iconMarker = '👾 ';

        const bar = bars[index];
        if (bar) {
          bar.style.width = `${pct}%`;
          bar.textContent = `${iconMarker}#${index + 1} ${p.name} — ${total} pts (Round: ${p.rounds[currentRound] || 0})`;
        }
      });
    }

    function exportFullLeaderboard() {
      const allSorted = sortedPlayers();
      if (allSorted.length === 0) {
        alert("No player scores to export!");
        return;
      }

      const roundCols = [];
      for (let r = 1; r <= TOTAL_ROUNDS; r++) roundCols.push(`Round ${r}`);
      let csvContent = `Rank,Player Info,${roundCols.join(',')},Total Score\n`;
      allSorted.forEach((p, idx) => {
        const safeName = p.name ? `"${String(p.name).replace(/"/g, '""')}"` : '"Unknown"';
        const perRound = [];
        for (let r = 1; r <= TOTAL_ROUNDS; r++) perRound.push(p.rounds[r] || 0);
        csvContent += `${idx + 1},${safeName},${perRound.join(',')},${totalOf(p)}\n`;
      });

      // "﻿" (BOM) makes Excel read emoji/Malay characters in nicknames correctly
      const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `CEG_Retro_Shake_Results_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // =====================================================================
    // STARTUP
    // =====================================================================
    (function init() {
      const restored = restoreHostState();
      if (!restored || phase === 'standby') {
        phase = 'standby';
        showStandby();
        setStartButton(true, 'START ROUND 1');
      } else if (phase === 'finished') {
        renderLeaderboard();
        document.getElementById('roundStatus').innerText = `👾 GAME OVER • TOURNAMENT FINISHED 👾 (restored)`;
        document.getElementById('timeRemaining').innerText = '00s';
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('exportBtn').style.display = 'inline-block';
      } else {
        // 'between' or 'interrupted'
        const wasInterrupted = phase === 'interrupted';
        phase = 'between';
        renderLeaderboard();
        if (Object.keys(players).length === 0) showStandby();
        document.getElementById('roundStatus').innerText = wasInterrupted
          ? `⚠️ ROUND ${currentRound} WAS INTERRUPTED — PRESS START TO REPLAY IT`
          : `RESTORED • GET READY FOR ROUND ${currentRound}`;
        setStartButton(true, `START ROUND ${currentRound}`);
        if (currentRound > 1 || wasInterrupted) document.getElementById('exportBtn').style.display = 'inline-block';
      }
      updateLinkStatus();
    })();
  </script>
</body>
</html>
