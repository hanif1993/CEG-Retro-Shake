<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>INTEL CEG MYS RETRO NIGHT • SHAKE-it CHALLENGE</title>
  <!-- Pinned version so a library update can't change behaviour on event night -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <style>
    html, body {
      position: fixed;
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px 15px;
      background-color: #0c0f1d;
      background-image:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      color: #fff;
      box-sizing: border-box;
    }
    .retro-icons { font-size: 1.8rem; letter-spacing: 6px; margin-bottom: 5px; margin-top: 10px; }
    h1 { font-size: 1.45rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; color: #00ffff; text-shadow: 0 0 8px #00ffff, 0 0 18px #00ffff; font-weight: 900; }
    .title-line-2 { font-size: 1.75rem; color: #ff007f; text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f; letter-spacing: 2px; margin-top: 3px; margin-bottom: 5px; }
    .tagline { color: #ffbf00; font-size: 0.85rem; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 6px rgba(255, 191, 0, 0.7); margin-bottom: 15px; }
    .card-box { background: #121526; border: 2px solid #3d1b5c; box-shadow: 0 0 25px rgba(255, 0, 127, 0.2); border-radius: 16px; padding: 15px 12px; max-width: 340px; margin: 0 auto; }
    .input-label { color: #00ffff; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 8px; margin-bottom: 3px; }
    input, button { font-family: inherit; font-size: 1.1rem; padding: 12px 16px; margin: 6px 0; border-radius: 8px; border: none; width: 92%; max-width: 290px; box-sizing: border-box; }
    input { background: #090b15; color: #fff; border: 2px solid #ff007f; text-align: center; box-shadow: inset 0 0 8px rgba(255, 0, 127, 0.3); }
    input:focus { outline: none; border-color: #00ffff; box-shadow: 0 0 12px #00ffff; }
    .btn-main { background: linear-gradient(90deg, #ff007f, #b300ff); color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; box-shadow: 0 0 18px #ff007f; letter-spacing: 1px; }
    #scoreDisplay { font-size: 4.8rem; font-weight: bold; color: #00ffff; margin: 5px 0; text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
    #timerDisplay { font-size: 2rem; font-weight: bold; color: #ffbf00; margin: 5px 0; text-shadow: 0 0 10px #ffbf00; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; }
    .status-wait { background: #1e293b; color: #ffbf00; border: 1px solid #ffbf00; }
    .status-shake { background: #ff007f; color: #fff; box-shadow: 0 0 15px #ff007f; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    /* NEW: small connection indicator + warning box */
    .conn-status { font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .conn-ok { color: #34d399; }
    .conn-bad { color: #ffbf00; }
    .warn-box { background: #3b0a1e; border: 2px solid #ff007f; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; line-height: 1.4; margin: 8px 0; }
  </style>
</head>
<body>

  <div class="retro-icons">🪩📼🛼🕹️📻</div>
  <h1>INTEL CEG MYS RETRO NIGHT</h1>
  <div class="title-line-2">✨ SHAKE-it CHALLENGE ✨</div>
  <div class="tagline">🕺 SHAKE YOUR GROOVE THING! 🕺</div>

  <!-- Screen 1: Join Screen -->
  <div id="joinScreen" class="card-box">
    <label class="input-label">🕺 YOUR NICKNAME</label>
    <input type="text" id="playerNickname" placeholder="e.g. DiscoQueen" maxlength="14" />

    <label class="input-label">🆔 YOUR WWID</label>
    <input type="text" id="playerWWID" placeholder="e.g. 12345678" inputmode="numeric" maxlength="10" />

    <button class="btn-main" id="joinBtn" onclick="joinGame()">🚀 JOIN THE DANCE FLOOR</button>
  </div>

  <!-- Screen 2: Active Game / Standby Screen -->
  <div id="gameScreen" class="card-box" style="display:none;">
    <div id="connStatus" class="conn-status conn-bad">🟠 CONNECTING…</div>
    <div id="playerTag" style="color: #00ffff; font-size: 0.9rem; margin-bottom: 8px; font-weight: bold;"></div>
    <div id="sensorWarning" class="warn-box" style="display:none;"></div>
    <div id="roundBadge" class="status-badge status-wait">⏳ STANDBY...</div>
    <div id="timerDisplay">30s</div>
    <h3 id="instructionText" style="color: #ff007f; text-shadow: 0 0 8px #ff007f; margin: 5px 0;">EYES ON THE BIG SCREEN!</h3>
    <div id="scoreDisplay">0</div>
    <p style="color: #94a3b8; font-size: 0.75rem; margin-top: 15px;">🪩 3 Rounds × 30s • Physical Shake Only 🪩<br>📱 Keep this screen open — don't lock your phone</p>
  </div>

  <script>
    // =====================================================================
    // CONFIG — topic names MUST match screen.html
    // =====================================================================
    const SUPABASE_URL = 'https://jtmctkvjfcqizcliimez.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KGzvBz2fj6wXguYTiz7c9A_YA4Du6wG';

    // Two separate topics (this is the main fix for 150 players):
    //   CONTROL_TOPIC : host -> phones (start / state / end / reset). Phones SUBSCRIBE to this.
    //   SCORES_TOPIC  : phones -> host. Phones only SEND here (over HTTPS) and never subscribe,
    //                   so a phone no longer receives the other 149 players' score updates.
    const CONTROL_TOPIC = 'ceg-retro-shake-control';
    const SCORES_TOPIC  = 'ceg-retro-shake-scores';

    // v2 storage key: old v1 data (e.g. rehearsal scores) is ignored automatically
    const STORAGE_KEY = 'ceg_retro_shake_v2';

    // Shake detection — same values as the original game
    const SHAKE_FORCE_THRESHOLD = 22;   // |x|+|y|+|z| (m/s²) needed to count one shake
    const SHAKE_DEBOUNCE_MS     = 75;   // at most one shake per 75 ms (~13 per second)

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: {
        // Called on every Realtime heartbeat (~25 s). Only used to update the status label.
        heartbeatCallback: (status) => {
          if (status === 'ok') setConnStatus(true);
          else if (status === 'timeout' || status === 'error') setConnStatus(false);
        }
      }
    });

    // =====================================================================
    // STATE
    // =====================================================================
    let playerId = '';
    let playerName = '';
    let gameId = null;          // tournament ID given by the host; a new ID wipes old scores
    let roundScores = {};       // this phone's score per round, e.g. { "1": 210, "2": 185 }
    let finishedRounds = {};    // rounds this phone has already closed, e.g. { "1": true }
    let currentRound = 0;       // round being played (or last played)
    let isRoundActive = false;
    let roundEndsAt = 0;        // local deadline (Date.now() ms) for the current round
    let syncMs = 6000;          // how often to send my score — the host decides this
    let lastShakeTime = 0;
    let lastSentScore = -1;
    let sendInFlight = false;
    let joined = false;
    let motionBlocked = false;
    let motionEventsSeen = 0;
    let motionListenerAttached = false;
    let hiddenSince = 0;
    let wakeLock = null;
    let syncTimeoutId = null;
    let finalFlushTimeoutId = null;
    let countdownIntervalId = null;
    let sensorCheckTimeoutId = null;
    let controlChannel = null;

    // Send-only channel object for scores. NEVER call .subscribe() on it.
    const scoresChannel = supabaseClient.channel(SCORES_TOPIC);

    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    // =====================================================================
    // SAVE / LOAD (survives an accidental page refresh)
    // =====================================================================
    function totalScore() {
      return Object.values(roundScores).reduce((sum, n) => sum + (Number(n) || 0), 0);
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.nick) document.getElementById('playerNickname').value = saved.nick;
        if (saved.wwid) document.getElementById('playerWWID').value = saved.wwid;
        if (typeof saved.gameId === 'string') gameId = saved.gameId;
        if (saved.roundScores && typeof saved.roundScores === 'object') roundScores = saved.roundScores;
        if (saved.finishedRounds && typeof saved.finishedRounds === 'object') finishedRounds = saved.finishedRounds;
        if (typeof saved.currentRound === 'number') currentRound = saved.currentRound;
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          nick: document.getElementById('playerNickname').value.trim(),
          wwid: document.getElementById('playerWWID').value.trim(),
          gameId,
          roundScores,
          finishedRounds,
          currentRound
        }));
      } catch (e) {}
    }

    loadSavedState();

    // =====================================================================
    // UI HELPERS
    // =====================================================================
    function setConnStatus(ok) {
      const el = document.getElementById('connStatus');
      if (!el) return;
      el.className = 'conn-status ' + (ok ? 'conn-ok' : 'conn-bad');
      el.innerText = ok ? '🟢 CONNECTED' : '🟠 RECONNECTING…';
    }

    function showWarning(html) {
      const el = document.getElementById('sensorWarning');
      el.innerHTML = html;
      el.style.display = html ? 'block' : 'none';
    }

    // Keep the screen awake so the phone doesn't lock between rounds
    // (a locked phone drops its connection and misses the START signal).
    async function keepScreenOn() {
      try {
        if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {
        console.warn('Wake lock not available:', e);
      }
    }

    // =====================================================================
    // JOIN
    // =====================================================================
    async function joinGame() {
      const nickInput = document.getElementById('playerNickname').value.trim();
      const wwidInput = document.getElementById('playerWWID').value.trim();

      if (!nickInput || !wwidInput) {
        alert('Please enter BOTH your Nickname and WWID to join!');
        return;
      }

      const cleanWwid = wwidInput.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      playerId = 'p_' + (cleanWwid || Math.random().toString(36).substring(2, 10));
      playerName = `${nickInput} (${wwidInput})`;
      saveState();
      document.getElementById('playerTag').innerText = `🕹️ PLAYER: ${playerName}`;

      // Both requests must start inside the tap, so start the wake lock first (no await)
      keepScreenOn();

      // iPhone: ask for motion permission and CHECK the answer
      motionBlocked = false;
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const answer = await DeviceMotionEvent.requestPermission();
          if (answer !== 'granted') motionBlocked = true;
        } catch (err) {
          console.warn('Motion permission request failed:', err);
        }
      }

      document.getElementById('joinScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      joined = true;

      if (!motionListenerAttached) {
        window.addEventListener('devicemotion', handleMotion, false);
        motionListenerAttached = true;
      }

      if (motionBlocked) {
        showWarning('⚠️ MOTION SENSOR BLOCKED<br>Close this tab, scan the QR again and tap <b>ALLOW</b>.');
      } else {
        showWarning('');
        // If no motion data arrives within 3 s, the browser isn't giving us the sensor
        clearTimeout(sensorCheckTimeoutId);
        const seenBefore = motionEventsSeen;
        sensorCheckTimeoutId = setTimeout(() => {
          if (motionEventsSeen === seenBefore) {
            showWarning('⚠️ NO MOTION DETECTED<br>Open the link in Safari or Chrome (not inside WhatsApp/Telegram). On iPhone, reopen and tap <b>ALLOW</b>.');
          }
        }, 3000);
      }

      connectControlChannel();
      sendJoinPacket();
      refreshStandbyText();
    }

    function connectControlChannel() {
      if (controlChannel) {
        supabaseClient.realtime.connect();   // no-op if already connected
        return;
      }
      controlChannel = supabaseClient.channel(CONTROL_TOPIC, {
        config: { broadcast: { self: false, ack: false } }
      });
      controlChannel.on('broadcast', { event: 'round_control' }, ({ payload }) => {
        handleRoundControl(payload);
      });
      let everSubscribed = false;
      controlChannel.subscribe((status) => {
        setConnStatus(status === 'SUBSCRIBED');
        // After a reconnect, say hello again so the host re-sends the round state quickly
        if (status === 'SUBSCRIBED') {
          if (everSubscribed) sendJoinPacket();
          everSubscribed = true;
        }
      });
    }

    // =====================================================================
    // SENDING TO THE HOST (HTTPS, host is the only receiver)
    // =====================================================================
    async function sendToHost(event, payload) {
      // Preferred: explicit REST send (newer library)
      try {
        if (typeof scoresChannel.httpSend === 'function') {
          await scoresChannel.httpSend(event, payload);
          return true;
        }
      } catch (e) {
        console.warn('httpSend failed, trying fallback:', e);
      }
      // Fallback: send() on an unsubscribed channel also goes over REST
      try {
        const res = await scoresChannel.send({ type: 'broadcast', event, payload });
        return res === 'ok';
      } catch (e) {
        console.warn('Score send failed:', e);
        return false;
      }
    }

    function sendJoinPacket() {
      if (!playerId) return;
      sendToHost('player_joined', { id: playerId, name: playerName, gameId });
    }

    async function sendScoreUpdate(force = false) {
      if (!playerId || !gameId || !currentRound) return false;
      const score = roundScores[currentRound] || 0;
      if (!force && score === lastSentScore) return true;   // nothing new to send
      if (!force && sendInFlight) return false;             // previous send still travelling
      sendInFlight = true;
      saveState();   // persist so a refresh keeps this round's points
      const ok = await sendToHost('score_update', {
        gameId,
        id: playerId,
        name: playerName,
        round: currentRound,
        roundScore: score,
        // All my round scores, so the host can fix an earlier round whose
        // final score didn't arrive (e.g. connection dropped right at TIME UP)
        allRounds: roundScores
      });
      sendInFlight = false;
      if (ok) lastSentScore = score;
      return ok;
    }

    function scheduleNextScoreSync(first = false) {
      clearTimeout(syncTimeoutId);
      if (!isRoundActive) return;
      // First send: random point inside one interval, so 150 phones don't fire together
      const delay = first ? Math.random() * syncMs : syncMs * (0.85 + Math.random() * 0.3);
      syncTimeoutId = setTimeout(async () => {
        if (!isRoundActive) return;
        await sendScoreUpdate(false);
        scheduleNextScoreSync(false);
      }, delay);
    }

    // =====================================================================
    // ROUND FLOW
    // =====================================================================
    function secondsLeft() {
      return Math.max(0, Math.ceil((roundEndsAt - Date.now()) / 1000));
    }

    function startCountdown() {
      clearInterval(countdownIntervalId);
      const tick = () => {
        if (!isRoundActive) { clearInterval(countdownIntervalId); return; }
        const left = secondsLeft();
        document.getElementById('timerDisplay').innerText = `${left}s`;
        // The phone closes its own round when time is up — it no longer
        // depends on receiving the host's "end" message.
        if (Date.now() >= roundEndsAt) finalizeRound();
      };
      tick();
      countdownIntervalId = setInterval(tick, 250);
    }

    function startRound(round, timeLeftSec, isFreshStart) {
      if (isRoundActive) finalizeRound();   // close a previous round we never got "end" for

      currentRound = round;
      // Fresh start (or host replays a round) -> 0. Late join after a refresh -> keep saved points.
      if (isFreshStart || typeof roundScores[round] !== 'number') roundScores[round] = 0;
      delete finishedRounds[round];
      isRoundActive = true;
      roundEndsAt = Date.now() + Math.max(1, timeLeftSec) * 1000;
      lastSentScore = -1;
      clearTimeout(finalFlushTimeoutId);
      saveState();

      document.getElementById('scoreDisplay').innerText = roundScores[round];
      document.getElementById('roundBadge').className = 'status-badge status-shake';
      document.getElementById('roundBadge').innerText = `🔥 ROUND ${round} LIVE! 🔥`;
      document.getElementById('instructionText').innerText = '🪩 SHAKE IT TO THE MAX! 🪩';
      startCountdown();
      scheduleNextScoreSync(true);
    }

    function finalizeRound() {
      if (!isRoundActive) return;
      isRoundActive = false;
      finishedRounds[currentRound] = true;
      clearInterval(countdownIntervalId);
      clearTimeout(syncTimeoutId);
      saveState();

      document.getElementById('roundBadge').className = 'status-badge status-wait';
      document.getElementById('roundBadge').innerText = `🏁 ROUND ${currentRound} COMPLETE!`;
      document.getElementById('timerDisplay').innerText = 'TIME UP!';
      document.getElementById('instructionText').innerText = `TOTAL SCORE: ${totalScore()} PTS`;

      // Final score: spread over 0–2.5 s so 150 phones don't all hit at once.
      // Retry up to 3 more times (1.5 s apart) if the network hiccups.
      clearTimeout(finalFlushTimeoutId);
      const roundToFlush = currentRound;
      const tryFlush = async (attempt) => {
        if (isRoundActive || currentRound !== roundToFlush) return;   // next round already started
        const ok = await sendScoreUpdate(true);
        if (!ok && attempt < 3) {
          finalFlushTimeoutId = setTimeout(() => tryFlush(attempt + 1), 1500);
        }
      };
      finalFlushTimeoutId = setTimeout(() => tryFlush(0), Math.floor(Math.random() * 2500));
    }

    function refreshStandbyText() {
      if (isRoundActive) return;
      if (currentRound && finishedRounds[currentRound]) {
        document.getElementById('instructionText').innerText = `TOTAL SCORE: ${totalScore()} PTS`;
      }
    }

    function adoptNewGame(newGameId) {
      // New tournament from the host: forget any old scores (rehearsal, previous event)
      isRoundActive = false;
      clearInterval(countdownIntervalId);
      clearTimeout(syncTimeoutId);
      clearTimeout(finalFlushTimeoutId);
      gameId = newGameId;
      roundScores = {};
      finishedRounds = {};
      currentRound = 0;
      lastSentScore = -1;
      saveState();
    }

    function handleRoundControl(data) {
      if (!data || !data.action) return;

      if (data.action === 'hard_reset') {
        adoptNewGame(data.gameId || null);
        joined = false;
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('timerDisplay').innerText = '30s';
        document.getElementById('roundBadge').className = 'status-badge status-wait';
        document.getElementById('roundBadge').innerText = '⏳ STANDBY...';
        document.getElementById('instructionText').innerText = 'EYES ON THE BIG SCREEN!';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('joinScreen').style.display = 'block';
        document.getElementById('joinBtn').innerText = "🚀 REJOIN STARTING LINE";
        return;
      }

      if (!joined) return;   // not on the dance floor yet

      if (data.gameId && data.gameId !== gameId) adoptNewGame(data.gameId);
      if (typeof data.syncMs === 'number') syncMs = Math.min(20000, Math.max(1500, data.syncMs));

      const round = Number(data.round) || 0;
      const timeLeft = Number(data.timeLeft) || 0;

      if (data.action === 'start') {
        startRound(round, timeLeft || 30, true);

      } else if (data.action === 'state') {
        // Periodic "round is live" signal from the host, for phones that missed START
        // (joined late, page refreshed, connection dropped).
        if (isRoundActive && currentRound === round) {
          roundEndsAt = Date.now() + timeLeft * 1000;     // re-sync the clock
        } else if (!finishedRounds[round] && timeLeft > 1) {
          startRound(round, timeLeft, false);
        }

      } else if (data.action === 'end') {
        finalizeRound();
      }
    }

    // =====================================================================
    // SHAKE DETECTION (same rule as the original)
    // =====================================================================
    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc) return;
      motionEventsSeen++;
      if (!isRoundActive) return;
      const now = Date.now();
      if (now >= roundEndsAt) return;

      const totalForce = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
      if (totalForce > SHAKE_FORCE_THRESHOLD && (now - lastShakeTime > SHAKE_DEBOUNCE_MS)) {
        roundScores[currentRound] = (roundScores[currentRound] || 0) + 1;
        lastShakeTime = now;
        document.getElementById('scoreDisplay').innerText = roundScores[currentRound];
      }
    }

    // =====================================================================
    // COMING BACK FROM LOCK SCREEN / ANOTHER APP
    // =====================================================================
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        hiddenSince = Date.now();
        return;
      }
      keepScreenOn();                        // wake lock is released when hidden
      if (joined) {
        supabaseClient.realtime.connect();   // reconnect if the socket died while hidden
        if (isRoundActive && Date.now() >= roundEndsAt) finalizeRound();
        if (hiddenSince && Date.now() - hiddenSince > 3000) sendJoinPacket();
      }
      hiddenSince = 0;
    });

    // Some browsers only grant the wake lock after a tap
    document.addEventListener('touchstart', () => { if (joined && !wakeLock) keepScreenOn(); }, { passive: true });
  </script>
</body>
</html>
